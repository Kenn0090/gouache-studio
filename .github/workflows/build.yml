name: Build Windows installer

# Every push to main builds an installer you can grab from the Actions tab (for testing).
# If the version in src-tauri/tauri.conf.json has no release yet, the push also publishes
# GitHub Release v<version> (notes from RELEASE_NOTES.md) with a signed latest.json, which is
# what installed copies of the app check on launch to update themselves.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Is this a new version?
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released - test build only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "v$v is new - publishing a release."
          fi
          { echo 'notes<<__END__'; cat RELEASE_NOTES.md; echo; echo '__END__'; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ steps.ver.outputs.release == 'true' && format('v{0}', steps.ver.outputs.version) || '' }}
          releaseName: 'Gouache Studio v${{ steps.ver.outputs.version }}'
          releaseBody: ${{ steps.ver.outputs.notes }}
          releaseDraft: false
          prerelease: false

      - name: Verify Windows updater
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $releaseVersion = "${{ steps.ver.outputs.version }}"
          $feedUrl = "https://github.com/Kenn0090/gouache-studio/releases/latest/download/latest.json"
          $feed = $null
          for ($attempt = 0; $attempt -lt 6; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $feedUrl -Headers @{ "Cache-Control" = "no-cache" }
              if ($candidate.version -eq $releaseVersion -or $candidate.version -eq "v$releaseVersion") { $feed = $candidate; break }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $feed) { throw "The updater feed does not advertise $releaseVersion." }
          $platforms = @($feed.platforms.PSObject.Properties | Where-Object { $_.Name.StartsWith("windows-") })
          if ($platforms.Count -eq 0) { throw "The updater feed has no Windows installer." }
          foreach ($platform in $platforms) {
            $entry = $platform.Value
            if ([string]::IsNullOrWhiteSpace($entry.signature)) { throw "The Windows updater signature is missing." }
            if ($entry.url -notlike "https://github.com/Kenn0090/gouache-studio/releases/download/v$releaseVersion/*") { throw "The updater points to another release." }
            $installer = Invoke-WebRequest -Uri $entry.url -Method Head
            if ($installer.StatusCode -ne 200) { throw "The Windows installer is unavailable." }
            $signature = (Invoke-WebRequest -Uri ($entry.url + ".sig")).Content
            if ($signature -is [byte[]]) { $signature = [Text.Encoding]::UTF8.GetString($signature) }
            if (([string]$signature).Trim() -cne ([string]$entry.signature).Trim()) { throw "The updater signature does not match the installer signature file." }
          }
          Write-Host "Verified Windows installer downloads and matching updater signatures for $releaseVersion."

      - name: Refresh the front-page Windows download
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $readmeJson = gh api "repos/$repo/contents/README.md?ref=main"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the front-page README." }
          $readme = $readmeJson | ConvertFrom-Json
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($readme.content))

          # A build for an older tag may finish after a newer release.
          $releaseJson = gh api "repos/$repo/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the latest release." }
          $latest = $releaseJson | ConvertFrom-Json
          $installer = $latest.assets | Where-Object name -like '*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "The latest release has no Windows x64 setup file." }

          $downloadReference = [regex]'(?m)^\[windows-download\]: [^\r\n]+'
          if ($downloadReference.Matches($text).Count -ne 1) {
            throw "Expected one Windows download reference in README.md."
          }
          $updated = $downloadReference.Replace($text, "[windows-download]: $($installer.browser_download_url)", 1)
          if ($updated -ceq $text) { return }

          $request = @{
            message = "Refresh the Windows download link for $($latest.tag_name) [skip ci]"
            sha = $readme.sha
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($updated))
            branch = 'main'
          }
          $requestFile = Join-Path $env:RUNNER_TEMP 'gouache-readme-update.json'
          $request | ConvertTo-Json -Compress | Set-Content -LiteralPath $requestFile -Encoding utf8
          gh api --method PUT "repos/$repo/contents/README.md" --input $requestFile --silent
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh the Windows download link." }

      - name: Keep the full installer
        shell: bash
        run: |
          mkdir -p out/full out/lite
          cp src-tauri/target/release/bundle/nsis/*.exe out/full/
          cp src-tauri/target/release/bundle/msi/*.msi out/full/ || true

      # The smaller installer: the same app without the Library files, skies and grunge maps inside (it fetches and keeps them
      # when used, and File > Content downloads them all for offline work). A problem here never stops the release above.
      - name: Build the smaller installer
        id: lite
        continue-on-error: true
        shell: bash
        env:
          GOUACHE_LITE: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          rm -rf src-tauri/target/release/bundle/nsis
          npx tauri build --bundles nsis
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            b=$(basename "$f" -setup.exe)
            cp "$f" "out/lite/${b}-lite-setup.exe"
          done
          ls -la out/lite

      - name: Put the smaller installer on the release
        if: steps.ver.outputs.release == 'true' && steps.lite.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.ver.outputs.version }}" out/lite/*.exe --clobber

      - name: Put Windows downloads first on the release page
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not read release $tag." }
          $release = $releaseJson | ConvertFrom-Json
          $full = $release.assets | Where-Object name -like '*_x64-setup.exe' | Select-Object -First 1
          $lite = $release.assets | Where-Object name -like '*_x64-lite-setup.exe' | Select-Object -First 1
          $msi = $release.assets | Where-Object name -like '*_x64*.msi' | Select-Object -First 1
          if (-not $full) { throw "Release $tag has no Windows x64 setup file." }

          $start = '<!-- gouache-downloads:start -->'
          $end = '<!-- gouache-downloads:end -->'
          $downloads = @(
            $start
            '## Download for Windows'
            ''
            "**[Download Gouache Studio for Windows (x64)]($($full.browser_download_url))** · Recommended. Includes the bundled materials, skies, and grunge maps."
          )
          if ($lite) {
            $downloads += '', "[Lite installer]($($lite.browser_download_url)) · Smaller download. Assets are downloaded as you use them."
          }
          if ($msi) {
            $downloads += '', "[MSI installer]($($msi.browser_download_url))"
          }
          $downloads += '', 'Already installed? In Gouache Studio, choose **File → Check for updates…**.', $end
          $body = ([string]$release.body).Replace("`r`n", "`n").TrimStart()
          $notes = [regex]::Replace($body, '(?s)\A<!-- gouache-downloads:start -->.*?<!-- gouache-downloads:end -->\s*', '')
          $updated = ($downloads -join "`n") + "`n`n" + $notes
          if ($updated -ne $body) {
            $notesFile = Join-Path $env:RUNNER_TEMP 'gouache-release-notes.md'
            Set-Content -LiteralPath $notesFile -Value $updated -Encoding utf8 -NoNewline
            gh release edit $tag --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not update release $tag." }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gouache-studio-windows
          path: |
            out/full/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.lite.outcome == 'success'
        with:
          name: gouache-studio-windows-lite
          path: out/lite/*.exe
          if-no-files-found: warn
