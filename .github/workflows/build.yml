name: Build Windows installer

# Every push to main builds an installer you can grab from the Actions tab (for testing).
# Pushing a version tag (v0.2.0 ...) also publishes a GitHub Release with a signed
# latest.json, which is what installed copies of the app check on launch to update themselves.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo 'NOTES<<__END__'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo '__END__'
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Gouache Studio ${{ github.ref_name }}'
          releaseBody: ${{ env.NOTES }}
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: gouache-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
