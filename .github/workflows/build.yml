name: Build Windows installer

# Every push to main builds an installer you can grab from the Actions tab (for testing).
# If the version in src-tauri/tauri.conf.json has no release yet, the push also publishes
# GitHub Release v<version> (notes from RELEASE_NOTES.md) with a signed latest.json, which is
# what installed copies of the app check on launch to update themselves.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Is this a new version?
        id: ver
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released - test build only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "v$v is new - publishing a release."
          fi
          { echo 'notes<<__END__'; cat RELEASE_NOTES.md; echo; echo '__END__'; } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ steps.ver.outputs.release == 'true' && format('v{0}', steps.ver.outputs.version) || '' }}
          releaseName: 'Gouache Studio v${{ steps.ver.outputs.version }}'
          releaseBody: ${{ steps.ver.outputs.notes }}
          releaseDraft: false
          prerelease: false

      - name: Verify Windows updater
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $releaseVersion = "${{ steps.ver.outputs.version }}"
          $feedUrl = "https://github.com/Kenn0090/gouache-studio/releases/latest/download/latest.json"
          $feed = $null
          for ($attempt = 0; $attempt -lt 6; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $feedUrl -Headers @{ "Cache-Control" = "no-cache" }
              if ($candidate.version -eq $releaseVersion -or $candidate.version -eq "v$releaseVersion") { $feed = $candidate; break }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $feed) { throw "The updater feed does not advertise $releaseVersion." }
          $platforms = @($feed.platforms.PSObject.Properties | Where-Object { $_.Name.StartsWith("windows-") })
          if ($platforms.Count -eq 0) { throw "The updater feed has no Windows installer." }
          foreach ($platform in $platforms) {
            $entry = $platform.Value
            if ([string]::IsNullOrWhiteSpace($entry.signature)) { throw "The Windows updater signature is missing." }
            if ($entry.url -notlike "https://github.com/Kenn0090/gouache-studio/releases/download/v$releaseVersion/*") { throw "The updater points to another release." }
            $installer = Invoke-WebRequest -Uri $entry.url -Method Head
            if ($installer.StatusCode -ne 200) { throw "The Windows installer is unavailable." }
            $signature = (Invoke-WebRequest -Uri ($entry.url + ".sig")).Content
            if ($signature -is [byte[]]) { $signature = [Text.Encoding]::UTF8.GetString($signature) }
            if (([string]$signature).Trim() -cne ([string]$entry.signature).Trim()) { throw "The updater signature does not match the installer signature file." }
          }
          Write-Host "Verified Windows installer downloads and matching updater signatures for $releaseVersion."

      - uses: actions/upload-artifact@v4
        with:
          name: gouache-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
