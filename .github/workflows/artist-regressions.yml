name: Artist regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  artist-regressions:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release versions
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          node scripts/bump.mjs $releaseVersion
          git diff --exit-code -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
      - run: npm run build
      - run: npm ci --prefix tests/e2e
      - run: node tests/e2e/p3-mask-sets-bevel.cjs
      - run: node tests/e2e/artist-fixes.cjs
      - run: node tests/e2e/symmetry.cjs
      - run: node tests/e2e/numeric-sliders.cjs
      - run: node tests/e2e/mesh-seams.cjs
      - run: node tests/e2e/blur-seam-layer.cjs
      - run: node tests/e2e/paint-bevel-seams.cjs
      - run: node tests/e2e/studio-tools.cjs
